name: libero10_spatial
num_tasks: 10
task_names:
- pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate
- pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate
- pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet_and_place_it_on_the_plate
- pick_up_the_black_bowl_next_to_the_cookie_box_and_place_it_on_the_plate
- pick_up_the_black_bowl_next_to_the_plate_and_place_it_on_the_plate
- pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate
- pick_up_the_black_bowl_on_the_cookie_box_and_place_it_on_the_plate
- pick_up_the_black_bowl_on_the_ramekin_and_place_it_on_the_plate
- pick_up_the_black_bowl_on_the_stove_and_place_it_on_the_plate
- pick_up_the_black_bowl_on_the_wooden_cabinet_and_place_it_on_the_plate
proprio_representation: ee_local_current_v1
shape_meta:
  obs:
    agentview_rgb:
      shape:
      - 3
      - 128
      - 128
      type: rgb
    wrist_rgb:
      shape:
      - 3
      - 128
      - 128
      type: rgb
    proprio:
      shape:
      - 14
      type: low_dim
    task_id:
      shape: []
      type: categorical
  action:
    shape:
    - 7
dataset:
  _target_: diffusion_policy.dataset.libero_spatial_image_dataset.LiberoSpatialImageDataset
  split: train
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  proprio_representation: ${task.proprio_representation}
  task_names: ${task.task_names}
  data_root: /home/user/yzchen_ws/imitation_learning/LIBERO/libero/datasets/spatial_4train/raw
  split_path: ${hydra:runtime.cwd}/data/spatial10_split.json
env_runner:
  _target_: diffusion_policy.env_runner.libero_image_runner.LiberoImageRunner
  task_vocabulary: ${task.task_names}
  init_state_indices: [0, 1, 2, 3, 4]
  sampling_seed: 20261002
  num_envs: 5
  prediction_horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  proprio_representation: ${task.proprio_representation}
  max_steps: 300
